name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: master
      platforms:
        description: Platforms to build
        required: false
        default: mac
        type: choice
        options:
          - mac
          - windows
          - linux
          - all

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mac:
    name: Build staged macOS artifacts
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.platforms == 'mac' || github.event.inputs.platforms == 'all')
    runs-on: macos-latest
    environment: release
    env:
      RELEASE_REF: ${{ github.event.inputs.ref || 'master' }}
    outputs:
      signing-mode: ${{ steps.signing-mode.outputs.mode }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Node 22 ships npm 10.9.x, whose dependency resolver crashes with
      # "Cannot read properties of null (reading 'edgesOut')" while
      # scripts/prepare-server.mjs installs @paperclipai/server. Reproduced on
      # 10.9.9, fixed on 11.19.0. Drop this step once node-version ships
      # npm >= 11; scripts/npm-preflight.mjs enforces the floor either way.
      - name: Pin npm 11 for the bundled-server install
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Signing is a board decision (HAV-32). Until an Apple Developer ID exists
      # the three signing secrets are absent, and this job builds an unsigned,
      # ad-hoc signed app instead of failing. It flips to the signed path on its
      # own the first time all three secrets are present — no workflow edit.
      - name: Resolve macOS signing mode
        id: signing-mode
        env:
          HAS_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY != '' }}
          HAS_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 != '' }}
          HAS_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_IDENTITY" = "true" ] && [ "$HAS_CERTIFICATE" = "true" ] && [ "$HAS_CERTIFICATE_PASSWORD" = "true" ]; then
            echo "MACOS_SIGNING_MODE=signed" >> "$GITHUB_ENV"
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "### macOS build: **signed** with a Developer ID" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "MACOS_SIGNING_MODE=unsigned" >> "$GITHUB_ENV"
            echo "ALLOW_UNSIGNED_MACOS_BUILD=true" >> "$GITHUB_ENV"
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            {
              echo "### macOS build: **unsigned** (ad-hoc signature)"
              echo
              echo "Apple signing secrets are not configured, so this build is not signed and"
              echo "not notarized. macOS will warn that it is from an unidentified developer on"
              echo "first open — see \`docs/install-runbook.md\`. Missing:"
              echo
              [ "$HAS_IDENTITY" = "true" ] || echo "- \`APPLE_CODESIGN_IDENTITY\`"
              [ "$HAS_CERTIFICATE" = "true" ] || echo "- \`MAC_CERTIFICATE_P12_BASE64\`"
              [ "$HAS_CERTIFICATE_PASSWORD" = "true" ] || echo "- \`MAC_CERTIFICATE_PASSWORD\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare Apple signing assets
        if: env.MACOS_SIGNING_MODE == 'signed'
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          KEYCHAIN_PATH="$RUNNER_TEMP/paperclip-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/paperclip-signing.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          export KEYCHAIN_PATH CERT_PATH

          echo "::add-mask::$KEYCHAIN_PASSWORD"

          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          raw = "".join(os.environ["MAC_CERTIFICATE_P12_BASE64"].split())
          Path(os.environ["CERT_PATH"]).write_bytes(base64.b64decode(raw))
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MAC_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          {
            echo "CSC_KEYCHAIN=$KEYCHAIN_PATH"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "CERT_PATH=$CERT_PATH"
          } >> "$GITHUB_ENV"

      - name: Build staged macOS distributables
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm release:mac:local

      - name: Prepare updater-compatible macOS release assets
        run: node scripts/prepare-macos-release-assets.mjs --input-root release/local-macos --output-dir release/mac-release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: release/mac-release-assets
          if-no-files-found: error

      - name: Clean up Apple signing assets
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "${CERT_PATH:-}"

  # Upstream deliberately skips `publish-release` when the mac job runs, because
  # upstream publishes macOS assets by hand from a Mac after notarization. We
  # need the workflow itself to publish, so this job does it — but only when the
  # dispatched ref is a version tag, which is the same explicit opt-in upstream's
  # `publish-release` uses. Dispatching `ref=master` therefore still only
  # produces a CI artifact and publishes nothing.
  publish-mac:
    name: Publish macOS release
    if: |
      github.event_name == 'workflow_dispatch' &&
      needs.build-mac.result == 'success' &&
      (startsWith(github.event.inputs.ref, 'v') || startsWith(github.event.inputs.ref, 'refs/tags/v'))
    needs:
      - build-mac
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ github.event.inputs.ref || 'master' }}
      MACOS_SIGNING_MODE: ${{ needs.build-mac.outputs.signing-mode }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: release-mac
          path: release/mac-release-assets

      - name: Resolve release tag
        run: |
          set -euo pipefail
          tag="${RELEASE_REF#refs/tags/}"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Write release notes
        run: |
          set -euo pipefail
          mkdir -p release
          {
            echo "Haven Office \`$RELEASE_TAG\` — havenCo's desktop shell for Paperclip."
            echo
            echo "**macOS only.** Download the \`.dmg\` that matches your Mac:"
            echo
            echo "- Apple Silicon (M1 and later) — \`*-arm64.dmg\`"
            echo "- Intel — the \`.dmg\` without \`arm64\` in the name"
            echo
            if [ "$MACOS_SIGNING_MODE" = "signed" ]; then
              echo "This build is **code signed** with havenCo's Apple Developer ID."
              echo "Notarization is a separate step — see \`docs/install-runbook.md\`."
            else
              echo "> **This build is not code signed or notarized.** macOS will refuse to open it"
              echo "> on the first double-click and say it is from an unidentified developer."
              echo "> Right-click the app in Applications and choose **Open**, then **Open** again."
              echo "> Full walkthrough: \`docs/install-runbook.md\`."
            fi
            echo
            echo "Install, first run, and how to connect to a Paperclip server:"
            echo "[docs/install-runbook.md](https://github.com/${{ github.repository }}/blob/$RELEASE_TAG/docs/install-runbook.md)"
          } > release/release-notes.md

      # Two passes, because publish-macos-release-assets.mjs refuses to upload
      # into a non-draft release: `staging` creates the draft and uploads the
      # DMGs, ZIPs and blockmaps, `final` adds latest-mac.yml (the auto-update
      # feed) and flips the draft to published only once everything is in place.
      - name: Upload macOS assets to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/publish-macos-release-assets.mjs \
            --mode staging \
            --tag "$RELEASE_TAG" \
            --input-dir release/mac-release-assets \
            --notes-file release/release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/publish-macos-release-assets.mjs \
            --mode final \
            --tag "$RELEASE_TAG" \
            --input-dir release/mac-release-assets \
            --notes-file release/release-notes.md \
            --publish

      - name: Summarise
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "### Published \`$RELEASE_TAG\`"
            echo
            echo "- Release: https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"
            echo "- Signing: **${MACOS_SIGNING_MODE:-unknown}**"
            echo
            echo "Next: run \`smoke-packaged-macos.yml\` with \`tag=$RELEASE_TAG\` for arm64 and x64."
          } >> "$GITHUB_STEP_SUMMARY"

  build-linux:
    name: Build Linux release
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.platforms == 'linux' || github.event.inputs.platforms == 'all')
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ github.event.inputs.ref || 'master' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Node 22 ships npm 10.9.x, whose dependency resolver crashes with
      # "Cannot read properties of null (reading 'edgesOut')" while
      # scripts/prepare-server.mjs installs @paperclipai/server. Reproduced on
      # 10.9.9, fixed on 11.19.0. Drop this step once node-version ships
      # npm >= 11; scripts/npm-preflight.mjs enforces the floor either way.
      - name: Pin npm 11 for the bundled-server install
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux distributables
        run: pnpm dist:linux

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  build-windows:
    name: Build Windows release
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.platforms == 'windows' || github.event.inputs.platforms == 'all')
    runs-on: windows-latest
    env:
      RELEASE_REF: ${{ github.event.inputs.ref || 'master' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Node 22 ships npm 10.9.x, whose dependency resolver crashes with
      # "Cannot read properties of null (reading 'edgesOut')" while
      # scripts/prepare-server.mjs installs @paperclipai/server. Reproduced on
      # 10.9.9, fixed on 11.19.0. Drop this step once node-version ships
      # npm >= 11; scripts/npm-preflight.mjs enforces the floor either way.
      - name: Pin npm 11 for the bundled-server install
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows distributables
        run: pnpm dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: |
      github.event_name == 'workflow_dispatch' &&
      (startsWith(github.event.inputs.ref, 'v') || startsWith(github.event.inputs.ref, 'refs/tags/v')) &&
      needs.build-mac.result == 'skipped' &&
      (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped')
    needs:
      - build-mac
      - build-linux
      - build-windows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(
            find dist-artifacts -type f \
              \( \
                -name '*.dmg' -o \
                -name '*.zip' -o \
                -name '*.exe' -o \
                -name '*.AppImage' -o \
                -name '*.deb' -o \
                -name '*.blockmap' -o \
                -name 'latest*.yml' \
              \) \
              -print0 | sort -z
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts were produced." >&2
            exit 1
          fi

          tag="${{ github.event.inputs.ref }}"
          tag="${tag#refs/tags/}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "$tag" --verify-tag
          fi
