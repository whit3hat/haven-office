appId: xyz.havenco.haven-office
productName: Haven Office
copyright: Copyright © 2026 havenCo. Based on aronprins/paperclip-desktop, © 2026 Aron Prins (MIT).

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

# Auto-update via GitHub Releases
publish:
  provider: github
  owner: whit3hat
  repo: haven-office
  releaseType: release

# Bundle the built server + UI alongside the app.
# node_modules comes from build/server-bundle (npm install --production output).
# dist/ and package.json come from the published @paperclipai/server npm package.
extraResources:
  - from: build/server-bundle/${os}-${arch}/server/dist
    to: app-server/server/dist
    filter:
      - "**/*"
  - from: build/server-bundle/${os}-${arch}/server/ui-dist
    to: app-server/server/ui-dist
    filter:
      - "**/*"
  - from: build/server-bundle/${os}-${arch}/server/node_modules
    to: app-server/server/node_modules
    filter:
      - "**/*"
  - from: build/server-bundle/${os}-${arch}/server/node_modules/@aws-sdk
    to: app-server/server/node_modules/@aws-sdk
    filter:
      - "**/*"
  - from: build/server-bundle/${os}-${arch}/server/node_modules/@aws-crypto
    to: app-server/server/node_modules/@aws-crypto
    filter:
      - "**/*"
  - from: build/server-bundle/${os}-${arch}/server/node_modules/@aws
    to: app-server/server/node_modules/@aws
    filter:
      - "**/*"
  - from: build/server-bundle/${os}-${arch}/server/package.json
    to: app-server/server/package.json
  # Plugins preinstalled into the local server on first launch. Deliberately
  # outside app-server/packages/plugins so the server treats them as ordinary
  # local-path installs and never tries to build them inside the bundle.
  - from: build/server-bundle/${os}-${arch}/plugins
    to: app-server/plugins
    filter:
      - "**/*"
  # Bundled Node.js binary (arch-specific, selected at build time)
  - from: "build/node-bin/${os}-${arch}"
    to: app-server/node-bin
    filter:
      - "**/*"
  # macOS menu-bar template icon (HAV-43). Placeholder glyph, not a designed
  # asset — swap when the real icon lands, same two filenames.
  - from: build/trayTemplate.png
    to: trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: trayTemplate@2x.png

# ─── macOS ───────────────────────────────────────────────────────────────────

afterPack: scripts/after-pack.mjs
afterSign: scripts/after-sign.mjs

mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  # macOS 15+ denies a GUI app access to private-network addresses until the
  # user grants Local Network, and an app can only be listed in Privacy &
  # Security → Local Network if it declares a purpose string. Kept in step with
  # buildStageConfig() in scripts/release-macos-local.mjs, which is the config
  # that actually builds every published .dmg.
  extendInfo:
    NSLocalNetworkUsageDescription: >-
      Haven Office connects to the Paperclip server you add as a remote
      connection. Lab and self-hosted servers normally live on your local
      network, so macOS requires this permission before Haven Office can reach
      them.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  signIgnore:
    - "/Contents/Resources/app-server/.*"
    - "\\.pak$"
    - "\\.bin$"
    - "\\.dat$"

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ─── Windows ─────────────────────────────────────────────────────────────────

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

# ─── Linux ───────────────────────────────────────────────────────────────────

linux:
  icon: build/icon.png
  category: Development
  maintainer: havenCo
  executableName: haven-office
  artifactName: "Haven-Office-${version}-${arch}.${ext}"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
